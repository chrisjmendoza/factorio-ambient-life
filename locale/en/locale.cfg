[mod-name]
AmbientLife=Ambient Life

[mod-description]
AmbientLife=Birds, butterflies and fireflies appear where the land is healthy. Wildlife density follows the trees and the pollution around you, so a thriving forest hums with life and a smog-choked one falls silent. Purely visual — nothing to build, nothing to fight.

[mod-setting-name]
ambientlife-enable-birds=Birds
ambientlife-enable-butterflies=Butterflies
ambientlife-enable-fireflies=Fireflies
ambientlife-max-creatures=Maximum creatures per player
ambientlife-density=Wildlife density
ambientlife-pollution-limit=Pollution that drives life away

[mod-setting-description]
ambientlife-enable-birds=Dark birds that wheel over wooded ground during the day.
ambientlife-enable-butterflies=Coloured butterflies that flutter over clean, well-wooded ground during the day. They are the first to disappear as pollution builds.
ambientlife-enable-fireflies=Points of light that drift and blink through forests after dark.
ambientlife-max-creatures=The largest number of creatures that can surround any one player at once. Lower this if you are chasing UPS; set it to 0 to turn the mod off entirely.
ambientlife-density=Scales how full a healthy landscape looks, without changing the hard maximum above. Below 1 even deep forest stays sparse; above 1 it teems.
ambientlife-pollution-limit=The pollution level at which wildlife abandons an area completely. Lower values mean wildlife is driven off by even light pollution. Set to 0 to ignore pollution.
